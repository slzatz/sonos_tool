[project]
name = "sonos-tool"
version = "0.1.0"
description = "A Sonos command-line tool for humans and AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "slzatz" }]
dependencies = [
    "soco>=0.31.2",
    "click>=8.1",
    "typesafe-sdk>=0.7,<1",
]

[project.scripts]
sonos = "sonos_tool.cli:cli"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sonos_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
